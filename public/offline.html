<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KF Auto ERP — Hors ligne</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9fafb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1b2a4a;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 360px; }
      h1 { font-size: 18px; margin-bottom: 8px; }
      p { font-size: 14px; color: #4b5563; line-height: 1.5; }
      button {
        margin-top: 16px;
        background: #1b2a4a;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Page non disponible hors ligne</h1>
      <p>
        Pas de reseau pour le moment. Vos donnees deja ouvertes (clients, produits, documents en cours)
        restent utilisables. Reessayez cette page des que la connexion revient.
      </p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
